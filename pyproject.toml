[project]
name = "ro-bot"
version = "0.1.0"
description = "Ragnarok Online hunting bot (Arduino HID, packet sniffer, process memory)."
requires-python = ">=3.12"
dependencies = [
    "pynput",
    "pyserial",
    "pywin32",
    "scapy",
]

[project.scripts]
ro-bot = "ro_bot.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ro_bot"]
